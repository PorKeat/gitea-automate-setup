---
- name: Ensure install directory exists
  file:
    path: "{{ gitea_install_dir }}"
    state: directory
    mode: '0755'
    owner: alexkgm
    group: alexkgm

- name: Template docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_install_dir }}/docker-compose.yml"
    mode: '0644'

- name: Ensure custom assets directory exists
  file:
    path: "{{ gitea_install_dir }}/data/gitea/public/assets/img"
    state: directory
    mode: '0755'

- name: Check if custom logo.png exists locally
  delegate_to: localhost
  become: no
  stat:
    path: "roles/gitea/files/logo.png"
  register: logo_png_file

- name: Upload custom logo.png
  copy:
    src: logo.png
    dest: "{{ gitea_install_dir }}/data/gitea/public/assets/img/logo.png"
    mode: '0644'
  when: logo_png_file.stat.exists

- name: Upload custom favicon.png (if logo.png exists)
  copy:
    src: logo.png
    dest: "{{ gitea_install_dir }}/data/gitea/public/assets/img/favicon.png"
    mode: '0644'
  when: logo_png_file.stat.exists

- name: Check if custom logo.svg exists locally
  delegate_to: localhost
  become: no
  stat:
    path: "roles/gitea/files/logo.svg"
  register: logo_svg_file

- name: Upload custom logo.svg
  copy:
    src: logo.svg
    dest: "{{ gitea_install_dir }}/data/gitea/public/assets/img/logo.svg"
    mode: '0644'
  when: logo_svg_file.stat.exists

- name: Upload custom favicon.svg (if logo.svg exists)
  copy:
    src: logo.svg
    dest: "{{ gitea_install_dir }}/data/gitea/public/assets/img/favicon.svg"
    mode: '0644'
  when: logo_svg_file.stat.exists

- name: Start Gitea via Docker Compose
  docker_compose:
    project_src: "{{ gitea_install_dir }}"
    state: present
    pull: yes
  register: compose_result

# Note: We assume docker-compose python module is installed on the host. 
# Alternatively, we can use the raw command.
- name: Start Gitea using shell (fallback)
  shell: |
    cd {{ gitea_install_dir }}
    docker compose up -d
  when: compose_result is failed or not compose_result
  ignore_errors: yes
